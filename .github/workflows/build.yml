name: otto-custom-build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Checkout upstream firmware v2.5.2
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          ref: v2.5.2
          path: src

      - name: Apply patches
        run: |
          set -e
          cd src
          sed -i 's/#define HAND_HOME_POSITION 45/#define HAND_HOME_POSITION 0/' main/boards/otto-robot/otto_movements.cc
          sed -i 's/PowerSaveLevel::LOW_POWER/PowerSaveLevel::PERFORMANCE/g' main/application.cc
          echo "=== verify patches ==="
          grep -n 'define HAND_HOME_POSITION' main/boards/otto-robot/otto_movements.cc
          echo "LOW_POWER remaining: $(grep -c 'LOW_POWER' main/application.cc || true)"
          echo "PERFORMANCE applied: $(grep -c 'PowerSaveLevel::PERFORMANCE' main/application.cc || true)"

      - name: Build otto-robot
        run: |
          set -e
          cd src
          . $IDF_PATH/export.sh
          python scripts/build.py otto-robot --name otto-robot
          echo "=== build outputs ==="
          ls -la build/*.bin || true

      - name: Publish binaries back to repo
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/fw"
          cp src/build/xiaozhi.bin "$GITHUB_WORKSPACE/fw/app.bin"
          if [ -f src/build/merged-binary.bin ]; then cp src/build/merged-binary.bin "$GITHUB_WORKSPACE/fw/merged.bin"; fi
          ls -la "$GITHUB_WORKSPACE/fw"
          cd "$GITHUB_WORKSPACE"
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -f fw
          git commit -m "firmware $(date -u +%Y%m%dT%H%M%SZ)" || echo "no changes"
          git push origin HEAD:main

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: otto-firmware
          path: fw/*.bin
          if-no-files-found: warn
